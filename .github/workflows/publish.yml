name: Publish

# Push a tag matching the package.json version (e.g. v1.0.0) to create a GitHub
# release with the .vsix attached. If the repository secret VSCE_PAT (Azure DevOps
# PAT, Marketplace > Manage) is set, the same .vsix is also published to the VS Code
# Marketplace; otherwise publish it by hand first (see RELEASING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Package
        run: npx vsce package --out better-csharp-references.vsix

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath better-csharp-references.vsix --skip-duplicate

      - name: Marketplace publishing skipped
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set, so the Marketplace step was skipped. Publish by hand (see RELEASING.md)."

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" better-csharp-references.vsix --title "${GITHUB_REF_NAME}" --notes "See [CHANGELOG.md](CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
